name: Compilar APK

on:
  push:
    branches:
      - main
      - "claude/**"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la web
        run: npm run build

      - name: Sincronizar con el proyecto Android
        run: npx cap sync android

      - name: Compilar APK (debug)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Preparar el archivo
        run: cp android/app/build/outputs/apk/debug/app-debug.apk DonPio.apk

      - name: Publicar como release descargable
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: "Don Pio — último build"
          body: |
            APK generado automáticamente desde `${{ github.ref_name }}` (commit ${{ github.sha }}).

            Descargá `DonPio.apk` desde este mismo release e instalalo — puede pedirte
            habilitar "instalar apps de fuentes desconocidas" la primera vez.
          prerelease: true
          files: DonPio.apk
